    <script>
      // Polyfill and safety wrapper for browser extensions intercepting window.fetch
      (function() {
        try {
          var _origFetch = window.fetch;
          var _customFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _customFetch || _origFetch;
            },
            set: function(fn) {
              _customFetch = fn;
            }
          });
        } catch (_) {}

        // Prevent third-party browser extension exceptions from bubbling to window error boundary
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1)
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
